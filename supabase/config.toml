
# Meta (Facebook/Instagram) webhook receiver. Meta sends no Supabase JWT, so JWT
# verification MUST be off — the function verifies Meta's own X-Hub-Signature-256
# instead. See supabase/functions/social-webhook/index.ts.
[functions.social-webhook]
enabled = true
verify_jwt = false
entrypoint = "./functions/social-webhook/index.ts"

[functions.watched-lot-alert]
enabled = true
verify_jwt = true
import_map = "./functions/watched-lot-alert/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/watched-lot-alert/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/watched-lot-alert/*.html" ]
